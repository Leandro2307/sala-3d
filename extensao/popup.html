<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 320px; font: 13px system-ui, sans-serif; background: #10131b; color: #eef1f7; }
  section { padding: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
  section:last-child { border-bottom: 0; }
  section[hidden] { display: none; }
  h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; }
  p { margin: 0 0 10px; color: #a3abbf; line-height: 1.4; }
  button { width: 100%; height: 34px; border: 0; border-radius: 9px; font: 600 13px system-ui, sans-serif; cursor: pointer; background: #6ee7c8; color: #062a22; }
  button:disabled { opacity: 0.6; cursor: progress; }
  button.tirar { background: rgba(255, 255, 255, 0.08); color: #eef1f7; border: 1px solid rgba(255, 255, 255, 0.14); }
  button.perigo { background: #f2555a; color: #fff; }
  ul { list-style: none; margin: 12px 0 0; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid rgba(255, 255, 255, 0.08); word-break: break-all; }
  li button { width: auto; height: 26px; padding: 0 10px; }
  a { color: #6ee7c8; cursor: pointer; }
  kbd { padding: 1px 5px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); font: 600 11px system-ui, sans-serif; }
  .site { font-weight: 600; color: #6ee7c8; }
  .linha { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; color: #a3abbf; font-size: 12px; }
  .msg { margin: 8px 0 0; color: #eef1f7; }
  .msg.erro { color: #fda4a7; }
  .ponto { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #dc2626; box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.25); }
  .rodape { color: #8f97ab; font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
  <section id="aba" hidden>
    <h1 id="aba-titulo">Mostrar esta aba na sala</h1>
    <p id="aba-txt"></p>
    <button id="aba-btn"></button>
    <p id="aba-msg" class="msg" hidden></p>
    <div class="linha"><span id="atalho"></span><a id="atalho-trocar"></a></div>
  </section>
  <section id="ctrl" hidden>
    <h1><i class="ponto"></i>Alguém está mexendo</h1>
    <p id="ctrl-txt"></p>
    <button id="ctrl-btn" class="perigo">Cortar o controle agora</button>
  </section>
  <section>
    <h1>Site da Sala 3D</h1>
    <p id="txt">Abra a aba da Sala 3D e clique aqui de novo.</p>
    <button id="btn" hidden></button>
    <ul id="lista"></ul>
  </section>
  <section class="rodape" id="rodape"></section>
  <script src="popup.js"></script>
</body>
</html>
